<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Management System | Login</title>
    <link class="styles" rel="stylesheet" href="Styles/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .login-card { max-width: 400px; width: 100%; border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .toast-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 9999;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }
        .toast-popup.show { opacity: 1; transform: translateY(0); }
        .toast-success { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .toast-danger { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    </style>
</head>
<body>

    <div id="statusToast" class="toast-popup"></div>

    <div class="card login-card p-4 bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">System Login</h3>
            <p class="text-muted small">Access your academic tracking profile</p>
        </div>

        <form action="auth_routes.php" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Symbol Number / Institutional ID</label>
                <input type="text" name="symbol_no" class="form-control" placeholder="e.g., S-1002 or T-202" required>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter account password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Sign In</button>
            
            <hr class="text-muted">

            <div class="text-center small">
                <span class="text-muted">New Account? Register as:</span><br>
                <a href="register-student.html" class="text-decoration-none fw-bold me-2">Student</a> | 
                <a href="register-teacher.html" class="text-decoration-none fw-bold text-success ms-2">Teacher</a>
            </div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const toast = document.getElementById('statusToast');

        if (urlParams.get('success') === 'registered') {
            toast.innerText = "Registration successful! Login below.";
            toast.classList.add('toast-success', 'show');
            setTimeout(() => {
                toast.classList.remove('show');
                window.history.replaceState({}, document.title, window.location.pathname);
            }, 2000);
        }

        if (urlParams.get('error') === 'invalid') {
            toast.innerText = "Account unavailable or credentials incorrect!";
            toast.classList.add('toast-danger', 'show');
            setTimeout(() => {
                toast.classList.remove('show');
                window.history.replaceState({}, document.title, window.location.pathname);
            }, 2500);
        }
    </script>
</body>
</html>
